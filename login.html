<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickCart - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">QuickCart</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="payment.html">Checkout</a>
    </nav>
  </header>

  <main>
    <section class="login-container">
      <h1>Login to Your Account</h1>
      <form action="#" method="post">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>

        <button type="submit" class="cta-button">Log In</button>
      </form>
      <p class="signup-hint">Don't have an account? <a href="#">Sign up</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 QuickCart. All rights reserved.</p>
  </footer>
</body>
</html>
