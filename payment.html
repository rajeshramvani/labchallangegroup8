<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Gateway Demo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:420px;
    background:#fff;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
    overflow:hidden;
}

.header{
    background:#1565c0;
    color:#fff;
    padding:20px;
    text-align:center;
}

.header h2{
    font-weight:normal;
}

.amount{
    margin-top:10px;
    font-size:24px;
    font-weight:bold;
}

.tabs{
    display:flex;
    border-bottom:1px solid #ddd;
}

.tab{
    flex:1;
    padding:15px;
    cursor:pointer;
    text-align:center;
    background:#f4f4f4;
    transition:.3s;
    border:none;
    font-size:15px;
}

.tab.active{
    background:#1565c0;
    color:#fff;
}

.content{
    padding:20px;
}

.payment-section{
    display:none;
}

.payment-section.active{
    display:block;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

.row{
    display:flex;
    gap:10px;
}

.row .col{
    flex:1;
}

button.pay{
    width:100%;
    background:#2e7d32;
    color:#fff;
    border:none;
    padding:14px;
    font-size:17px;
    border-radius:6px;
    cursor:pointer;
    transition:.3s;
}

button.pay:hover{
    background:#1b5e20;
}

.success{
    display:none;
    margin-top:20px;
    background:#e8f5e9;
    color:#2e7d32;
    border:1px solid #81c784;
    padding:12px;
    border-radius:5px;
    text-align:center;
}

.note{
    margin-top:15px;
    color:#666;
    font-size:13px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h2>Secure Payment</h2>
<div class="amount">$100.00</div>
</div>

<div class="tabs">
<button class="tab active" onclick="showTab('card',this)">💳 Card</button>
<button class="tab" onclick="showTab('netbanking',this)">🏦 Net Banking</button>
<button class="tab" onclick="showTab('upi',this)">📱 UPI</button>
</div>

<div class="content">

<!-- CARD -->
<div id="card" class="payment-section active">

<label>Card Holder Name</label>
<input type="text" id="holder" placeholder="John Doe">

<label>Card Number</label>
<input
type="text"
id="cardnumber"
maxlength="19"
placeholder="4111 1111 1111 1111">

<div class="row">
<div class="col">
<label>Expiry</label>
<input type="text" id="expiry" placeholder="MM/YY">
</div>

<div class="col">
<label>CVV</label>
<input type="password" id="cvv" maxlength="4" placeholder="123">
</div>
</div>

<button class="pay" onclick="pay('Visa Card')">
Pay $100
</button>

</div>

<!-- NET BANKING -->
<div id="netbanking" class="payment-section">

<label>Select Bank</label>

<select id="bank">

<option>State Bank of India</option>
<option>HDFC Bank</option>
<option>ICICI Bank</option>
<option>Axis Bank</option>
<option>Punjab National Bank</option>
<option>Kotak Mahindra Bank</option>

</select>

<label>Customer ID</label>
<input type="text" placeholder="Customer ID">

<button class="pay" onclick="pay('Net Banking')">
Pay $100
</button>

</div>

<!-- UPI -->

<div id="upi" class="payment-section">

<label>UPI ID</label>

<input
type="text"
id="upiid"
placeholder="username@upi">

<button class="pay" onclick="pay('UPI')">
Pay $100
</button>

</div>

<div class="success" id="success"></div>

<div class="note">
Demo Payment Page (Testing Purpose Only)
</div>

</div>

</div>

<script>

function showTab(id,element){

document.querySelectorAll(".payment-section").forEach(function(sec){
sec.classList.remove("active");
});

document.getElementById(id).classList.add("active");

document.querySelectorAll(".tab").forEach(function(btn){
btn.classList.remove("active");
});

element.classList.add("active");

document.getElementById("success").style.display="none";

}

function pay(method){

let success=document.getElementById("success");

success.style.display="block";

success.innerHTML=
"<strong>Payment Successful!</strong><br><br>"+
"Method : "+method+
"<br>Amount : $100.00"+
"<br><br>Transaction ID : TXN"+
Math.floor(Math.random()*100000000);

}

document.getElementById("cardnumber").addEventListener("input",function(e){

let value=e.target.value.replace(/\D/g,'');

value=value.replace(/(.{4})/g,'$1 ').trim();

e.target.value=value;

});

document.getElementById("expiry").addEventListener("input",function(e){

let value=e.target.value.replace(/\D/g,'');

if(value.length>2){
value=value.substring(0,2)+"/"+value.substring(2,4);
}

e.target.value=value;

});

</script>

</body>
</html>
